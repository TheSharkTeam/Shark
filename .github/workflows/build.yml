name: Build

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"

  workflow_call:
    inputs:
      environment:
        type: string
        default: "auto"
      version:
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - staging
          - production

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_NDK_VERSION: "21.4.7075529"
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  HXCPP_CACHE_MB: "4000"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: windows
            os: windows-latest
            artifact-path: export/windows/bin
          - name: Linux
            target: linux
            os: ubuntu-latest
            artifact-path: export/linux/bin
          - name: macOS
            target: mac
            os: macos-latest
            artifact-path: export/macos/bin
          - name: Android
            target: android
            os: ubuntu-latest
            artifact-path: export/android/bin/app/build/outputs/apk/**/*.apk
          - name: iOS
            target: ios
            os: macos-latest
            artifact-path: export/ios/Shark.ipa

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ inputs.environment || 'auto' }}

      - name: Set version
        uses: ./.github/actions/set-version
        with:
          version: ${{ inputs.version || '' }}

      - name: Setup Haxe toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('hmm.json', 'Project.hxp') }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('hmm.json', 'Project.hxp') }}-
            hxcpp-${{ matrix.target }}-${{ runner.os }}-

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Restore Android NDK cache
        if: matrix.target == 'android'
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android NDK
        if: matrix.target == 'android' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Restore Gradle cache
        if: matrix.target == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('hmm.json', 'Project.hxp') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Lime for Android
        if: matrix.target == 'android'
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Prepare Android keystore
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        run: |
          mkdir -p Certificates

          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > Certificates/android.keystore
            echo "SHARK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "::error::Release requires Android signing secrets"
            exit 1
          else
            keytool -genkeypair \
              -keystore Certificates/android.keystore \
              -alias android \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Shark, OU=TheSharkTeam, O=TheSharkTeam, L=Unknown, S=Unknown, C=BR"
          fi

      - name: Select Xcode
        if: matrix.target == 'ios'
        uses: ./.github/actions/select-xcode

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/build-retry
        with:
          target: ${{ matrix.target }}
          extra-args: ${{ matrix.target == 'ios' && '-nosign' || '' }}

      - name: Package iOS app
        if: matrix.target == 'ios'
        run: |
          app=$(find export/ios/build -type d -name "*.app" -path "*iphoneos*" | head -n1)

          if [[ -z "$app" ]]; then
            echo "::error::No .app bundle found in export/ios/build"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry export/ios/Shark.ipa Payload

      - name: Upload ${{ matrix.name }} build
        uses: actions/upload-artifact@v4
        with:
          name: Shark-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-${{ matrix.name }}-Logs
          path: |
            export/**/*.log
            *.log
          if-no-files-found: ignore
          retention-days: 7
