name: Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Build environment"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - staging
          - production

      create_release:
        description: "Create GitHub release (v* tags only)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_NDK_VERSION: "21.4.7075529"
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ inputs.environment || 'auto' }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: android-hxcpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-hxcpp-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Haxe toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          skip-lime-setup: "true"

      - name: Configure Lime Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime setup -y android

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Prepare Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        shell: bash
        run: |
          mkdir -p Certificates

          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > Certificates/android.keystore

            echo "SHARK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD" >> "$GITHUB_ENV"

          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release requires Android signing secrets"
            exit 1

          else
            keytool -genkeypair \
              -keystore Certificates/android.keystore \
              -alias android \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Shark, OU=TheSharkTeam, O=TheSharkTeam, L=Unknown, S=Unknown, C=BR"

            echo "SHARK_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS=android" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        uses: ./.github/actions/build-retry
        timeout-minutes: 25
        with:
          target: android

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Android-Logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Android
          path: |
            export/android/bin/app/build/outputs/apk/**/*.apk
            export/android/bin/**/*.apk
          if-no-files-found: error
          retention-days: 14

  build-summary:
    name: Build Summary
    if: always()
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        env:
          BUILD_RESULT: ${{ needs.build-android.result }}
        run: |
          {
            echo "## Shark Android Build"
            echo ""
            echo "**Repository:** TheSharkTeam/Shark"
            echo "**Branch/Tag:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "| Platform | Status |"
            echo "|---|---|"
            echo "| Android | $BUILD_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Publish Android Release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release == 'yes' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-android.result == 'success'
    needs: build-android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Shark-Android
          path: release-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shark ${{ github.ref_name }}
          generate_release_notes: true
          files: release-apk/**/*.apk
          fail_on_unmatched_files: true
