name: Setup Shark toolchain
description: Installs Haxe and hmm, then installs every dependency from hmm.json with the haxelib folder cached between runs

inputs:
  haxe-version:
    required: true

runs:
  using: composite
  steps:
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ inputs.haxe-version }}

    - name: Restore haxelib cache
      uses: actions/cache@v4
      with:
        path: .haxelib
        key: haxelib-${{ runner.os }}-${{ inputs.haxe-version }}-${{ hashFiles('hmm.json') }}
        restore-keys: |
          haxelib-${{ runner.os }}-${{ inputs.haxe-version }}-

    - name: Install hmm
      shell: bash
      run: |
        haxelib --global install hmm --always --quiet

    - name: Install dependencies
      shell: bash
      run: haxelib --global run hmm install

    - name: List installed haxelibs
      shell: bash
      run: haxelib list
