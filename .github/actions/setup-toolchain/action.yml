name: Setup Shark toolchain
description: Installs Haxe and the hmm dependencies, restoring them from cache when hmm.json has not changed

inputs:
  haxe-version:
    required: true

runs:
  using: composite
  steps:
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ inputs.haxe-version }}

    - name: Restore haxelib cache
      id: haxelib-cache
      uses: actions/cache@v4
      with:
        path: .haxelib
        key: haxelib-${{ runner.os }}-${{ inputs.haxe-version }}-${{ hashFiles('hmm.json') }}

    - name: Install dependencies
      if: steps.haxelib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        haxelib newrepo
        haxelib install hmm --always --quiet
        haxelib run hmm install

    - name: List installed haxelibs
      shell: bash
      run: haxelib list
