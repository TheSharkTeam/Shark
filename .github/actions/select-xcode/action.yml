name: Select Xcode
description: Points xcode-select at the newest installed Xcode whose major version hxcpp can still build with

inputs:
  max-major:
    required: false
    default: "16"

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        MAX_MAJOR: ${{ inputs.max-major }}
      run: |
        SELECTED=""

        for app in $(ls /Applications | grep -E '^Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V); do
          major=$(echo "$app" | sed -E 's/^Xcode_([0-9]+).*/\1/')

          if [ "$major" -le "$MAX_MAJOR" ]; then
            SELECTED="$app"
          fi
        done

        if [ -z "$SELECTED" ]; then
          echo "::error::No Xcode with major version <= $MAX_MAJOR found on this runner"
          exit 1
        fi

        echo "Selecting /Applications/$SELECTED"
        sudo xcode-select -s "/Applications/$SELECTED"
        xcodebuild -version
        rm -rf ~/Library/Developer/Xcode/DerivedData
