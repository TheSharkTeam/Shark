name: Set version
description: Writes the VERSION file from an explicit version or from the pushed release tag

inputs:
  version:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ -n "$INPUT_VERSION" ]]; then
          echo "$INPUT_VERSION" > VERSION
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "${GITHUB_REF_NAME#v}" > VERSION
        fi

        if [[ -f VERSION ]]; then
          echo "VERSION set to $(cat VERSION)"
        fi
